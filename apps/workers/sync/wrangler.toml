name = "aioff-sync"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# The public address. Wrangler creates the DNS record and certificate on deploy.
routes = [{ pattern = "sync.aioff.app", custom_domain = true }]
# Blobs live in R2 (free tier: 10 GB, 1M writes a month). No KV, no database, no accounts.
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "aioff-sync"
