<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked by AI Off</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; background: #f4f1ea; color: #1b1a17; }
      @media (prefers-color-scheme: dark) { body { background: #151412; color: #f1eee6; } }
      main { max-width: 440px; padding: 24px; text-align: center; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 16px; opacity: .8; }
      button { font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid currentColor; background: none; color: inherit; cursor: pointer; margin: 4px; }
      button.primary { background: #d8442b; border-color: #d8442b; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>AI Off blocked <span id="host">this site</span></h1>
      <p id="why">You are on Level 4, Blackout, which blocks AI companies at the network level. That includes chatbots.</p>
      <div id="actions">
        <button id="pause" class="primary">Pause AI Off for 15 minutes</button>
        <button id="level">Drop to Level 3</button>
      </div>
      <button id="back">Go back</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
