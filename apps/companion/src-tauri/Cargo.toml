[package]
name = "aioff-companion"
version = "0.1.0"
description = "AI Off desktop companion"
authors = ["AI Off contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "aioff_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
